<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פידבק — לילוש טובוש</title>
<style>
    /* Version: v5.8 | Last modified: 2026-11-16 23:00 (Israel time) | Claude
       Beta feedback form - standalone page reached from landing (when a code is
       exhausted) and from the nano-book results screen. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --sand: #fff9e6;
        --sand-deep: #ffe8a8;
        --accent: #f59e0b;
        --accent-dark: #c2660a;
        --ink: #2d2416;
        --ink-soft: #5a4f38;
        --card: #ffffff;
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }
    body {
        font-family: 'Heebo', -apple-system, sans-serif;
        background: linear-gradient(135deg, var(--sand) 0%, var(--sand-deep) 100%);
        color: var(--ink);
        line-height: 1.55;
        min-height: 100vh;
        padding: 24px 16px;
    }
    .wrap {
        max-width: 600px;
        margin: 0 auto;
        background: var(--card);
        padding: 28px 26px;
        border-radius: 20px;
        box-shadow: var(--shadow);
    }
    h1 {
        font-size: 1.6rem;
        margin-bottom: 6px;
    }
    p.lead {
        color: var(--ink-soft);
        margin-bottom: 24px;
    }
    label {
        display: block;
        font-weight: 600;
        margin-top: 18px;
        margin-bottom: 6px;
    }
    label small {
        font-weight: 400;
        color: var(--ink-soft);
        margin-right: 6px;
    }
    textarea, input[type=text] {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #e6dcc6;
        border-radius: 10px;
        font-family: inherit;
        font-size: 1rem;
        background: #fffdf7;
        resize: vertical;
    }
    textarea { min-height: 80px; }
    textarea:focus, input[type=text]:focus {
        outline: none;
        border-color: var(--accent);
    }
    .rating {
        display: flex;
        gap: 8px;
        margin-top: 6px;
    }
    .rating-btn {
        flex: 1;
        padding: 12px 6px;
        border: 2px solid #e6dcc6;
        border-radius: 10px;
        background: #fffdf7;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
    }
    .rating-btn.selected {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    .submit-btn {
        margin-top: 24px;
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
    }
    .submit-btn:hover:not(:disabled) { background: var(--accent-dark); }
    .submit-btn:disabled { background: #d4c7a3; cursor: wait; }
    .msg {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        display: none;
    }
    .msg.ok {
        display: block;
        background: #e7f5e9;
        color: #246729;
    }
    .msg.err {
        display: block;
        background: #fde8e8;
        color: #9b1c1c;
    }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--accent-dark);
        text-decoration: none;
        font-size: 0.95rem;
    }
</style>
</head>
<body>
<div class="wrap">
    <h1>📝 פידבק על הבטא</h1>
    <p class="lead">תודה שניסית את לילוש טובוש! הפידבק שלך קובע מה נבנה הבא.</p>

    <label>איך היה? <small>(חובה)</small></label>
    <div class="rating" id="ratingRow">
        <button type="button" class="rating-btn" data-value="1">😕 גרוע</button>
        <button type="button" class="rating-btn" data-value="2">😐 בסדר</button>
        <button type="button" class="rating-btn" data-value="3">🙂 טוב</button>
        <button type="button" class="rating-btn" data-value="4">😄 מעולה</button>
    </div>

    <label>מה עבד טוב? <small>(אופציונלי)</small></label>
    <textarea id="workedWell" placeholder="משהו שעבד יפה, הפתיע לטובה, גרם לחיוך..."></textarea>

    <label>מה פחות עבד? <small>(אופציונלי)</small></label>
    <textarea id="needsWork" placeholder="באגים, חוסר עקביות, UX לא נוח, פיצ'רים שחסרים..."></textarea>

    <label>הערות נוספות / רעיונות <small>(אופציונלי)</small></label>
    <textarea id="notes" placeholder=""></textarea>

    <button class="submit-btn" id="submitBtn" onclick="submitFeedback()">שלח פידבק</button>
    <div class="msg" id="msg"></div>

    <a href="/" class="back-link">← חזרה לדף הבית</a>
</div>

<script>
    const LS_CODE_KEY = 'lilush_access_code';
    let selectedRating = null;

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.rating-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedRating = btn.dataset.value;
            });
        });
    });

    async function submitFeedback() {
        if (!selectedRating) {
            showMsg('נא לבחור דירוג', 'err');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'שולח...';

        const payload = {
            code: localStorage.getItem(LS_CODE_KEY) || '',
            rating: selectedRating,
            worked_well: document.getElementById('workedWell').value,
            needs_work: document.getElementById('needsWork').value,
            notes: document.getElementById('notes').value
        };

        try {
            const r = await fetch('/api/submit-feedback', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await r.json();
            if (data.success) {
                showMsg('✓ תודה רבה! הפידבק נשמר.', 'ok');
                btn.textContent = 'נשלח ✓';
                // Clear form
                document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
                document.getElementById('workedWell').value = '';
                document.getElementById('needsWork').value = '';
                document.getElementById('notes').value = '';
                selectedRating = null;
            } else {
                throw new Error(data.error || 'failed');
            }
        } catch (err) {
            console.error(err);
            showMsg('לא הצלחנו לשמור. נסה שוב בעוד רגע.', 'err');
            btn.disabled = false;
            btn.textContent = 'שלח פידבק';
        }
    }

    function showMsg(text, kind) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = 'msg ' + kind;
    }
</script>
</body>
</html>
